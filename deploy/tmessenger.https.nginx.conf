# This exact hostname replaces the old Site Manager route for this domain.
# All application routing is handled by the tmessenger-proxy Docker service.
# The shared host TLS edge stays in place for the server's other websites.
server {
    listen 185.252.29.27:443 ssl;
    server_name tmessenger.taavonafarin.ir;
    ssl_certificate /etc/letsencrypt/live/tmessenger.taavonafarin.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmessenger.taavonafarin.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 30m;
    proxy_cache off;
    error_log /var/log/nginx/tmessenger.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:18880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
