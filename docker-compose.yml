services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taavon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taavon_dev_password}
      POSTGRES_DB: taavon
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taavon -d taavon']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev/test. MinIO speaks the S3 API,
  # so services/api's s3-storage-provider (built against @aws-sdk/client-s3)
  # works unchanged against either MinIO here or a real S3-compatible service
  # in production - only S3_ENDPOINT/credentials differ.
  object-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-taavon_dev_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-taavon_dev_secret_key}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the app's bucket once MinIO is healthy, then exits.
  # `--ignore-existing` makes re-runs (container recreation, restarts) a
  # no-op instead of an error.
  object-storage-init:
    image: minio/mc:latest
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-taavon-dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-taavon_dev_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-taavon_dev_secret_key}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\"
      "
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://taavon:${POSTGRES_PASSWORD:-taavon_dev_password}@postgres:5432/taavon
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-taavon-dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-taavon_dev_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-taavon_dev_secret_key}
      # No default for either secret: env.ts fails production fast on a
      # missing/short/placeholder value, and neither belongs baked into
      # this file - set them in a real .env before deploying.
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?SESSION_HMAC_KEY must be set}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?PHONE_ENCRYPTION_KEY must be set}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/v1/health/live', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  # The only service that publishes a port to the host - see
  # deploy/Caddyfile for the routing contract.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  caddy_data:
