// --- Helper Functions ---
const getTime = () => {
  const now = new Date();
  return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
};

const callGeminiAPI = async (prompt, systemInstruction) => {
  const reversedKeys = [
    "wwP7z-Lmtf-J5z0pYC5cDwXhAqjt2QlvCySazIA",
    "yqDn4Zsz7qmPG0qifGtJNaPq1ZyjejeJyaSyazIA",
    "MQiz1GvQrx6DN4g-Z2oNY7A__mTXBySaSyazIA",
    "KDTOaQ_6atWE4qV4qEGun9opbf1WwP39DyaSyazIA",
    "QdWEXoqKzsqKSzsgmOaKzVhin8u9J5kB8rAyaSyazIA"
  ];
  
  const keys = reversedKeys.map(k => k.split('').reverse().join(''));

  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: prompt }]
          }],
          systemInstruction: systemInstruction ? {
            parts: [{ text: systemInstruction }]
          } : undefined,
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 1000
          }
        })
      });

      if (!response.ok) {
        console.warn(`Key ${i} failed with status: ${response.status}`);
        continue;
      }

      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) {
        return text;
      }
    } catch (error) {
      console.warn(`Key ${i} threw error:`, error);
    }
  }
  throw new Error("متأسفانه ارتباط با هوش مصنوعی با خطا مواجه شد. لطفاً دوباره تلاش کنید.");
};

          setPoetryHemistichs(hemistichs);

        setMiniappError("سرودن شعر با خطا مواجه شد. دوباره تلاش کنید.");
      } finally {
        setMiniappLoading(false);
      }
    };

      setPoetryLoadingIndex(index);
      try {
        const context = poetryHemistichs.map((h, i) => i === index ? '[مصرع مورد نظر برای بازسازی]' : h).join('\n');

        const userPrompt = `شعر فعلی:\n${context}\n\nلطفاً فقط مصرع شماره ${index + 1} را بازسازی کن و آن را بفرست.`;

                    onClick={() => {
                      setShowAiModal(false);
                      setTimeout(() => setAiFlowState('initial'), 300);
                    }}
                    className="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-3 rounded-xl font-medium text-[14px] transition-colors"
                  >
                    خیر، ورود معمولی به بستر
                  </button>
                </div>
              </div>
            )}
            {aiFlowState === 'upgrade_success' && (
              <div className="flex flex-col h-full animate-in fade-in zoom-in-95 duration-300 justify-between text-center">
                <div>
                  <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 shadow-sm mx-auto"><CheckCheck size={40} /></div>
                  <div className="bg-white border border-gray-100 p-6 rounded-2xl text-gray-800 text-[14px] font-medium leading-relaxed mb-5 shadow-sm text-center">
                    تبریک! دستیار هوشمند با موفقیت ساخته شد و به بستر متصل گردید.
                    <br/><br/>
                    اکنون شما و کاربران بستر می‌توانید با کلیک روی آیکن سنجاق، از هوش مصنوعی جمینای برای ساخت کارتهای واحد ارزش استفاده کنید.
                  </div>
                </div>
                <button 
                  onClick={() => {
                    setShowAiModal(false);
                    setTimeout(() => setAiFlowState('initial'), 300);
                  }}
                  className="w-full bg-gradient-to-r from-[#4CAF50] to-[#45a049] text-white py-4 rounded-xl font-bold text-[16px] flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95 animate-pulse"
                >
                  ورود به بستر هوشمند شده
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  const renderRulesModal = () => {
    if (!showRulesModal) return null;
    return (
      <div className="absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-in fade-in">
        <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95">
          <div className="bg-[#527DA3] p-4 flex items-center justify-between text-white shrink-0">
            <h2 className="font-medium text-[16px]">قوانین و میثاق‌نامه</h2>
            <button onClick={() => setShowRulesModal(false)} className="hover:bg-white/10 rounded-full p-1.5 transition"><X size={20} /></button>
          </div>
          <div className="p-5 text-[13px] text-gray-700 leading-relaxed text-justify space-y-3">
            <p>برادر/خواهر گرامی، با کلیک روی دکمه، شما متعهد می‌شوید که:</p>
            <ul className="list-disc list-inside space-y-1">
              <li>قوانین بستر را به صورت کامل مطالعه کرده‌اید.</li>
              <li>در صورت عدم نیاز، فوراً درخواست خود را لغو کنید.</li>
              <li>اخلاق و ادب را در مراودات رعایت فرمایید.</li>
            </ul>
            <label className="flex items-center gap-2 mt-4 cursor-pointer bg-gray-50 p-3 rounded-xl border border-gray-200">
              <input type="checkbox" checked={rulesAccepted} onChange={(e) => setRulesAccepted(e.target.checked)} className="w-4 h-4 rounded text-[#527DA3] focus:ring-[#527DA3]" />
              <span className="font-medium text-[13px] text-gray-800">قوانین را می‌پذیرم</span>
            </label>
          </div>
          <div className="p-4 border-t border-gray-100 bg-gray-50 flex gap-3">
            <button onClick={() => setShowRulesModal(false)} className="flex-1 py-2.5 rounded-xl font-medium text-gray-600 bg-white border border-gray-300 shadow-sm transition active:scale-95">انصراف</button>
            <button 
              disabled={!rulesAccepted} 
              onClick={() => {
                const actionText = `${CURRENT_USER.name} درخواست ${activePlatform.actionLabel} ثبت کرد.`;
                const newComment = { id: Date.now(), text: actionText, isSystem: true };
                setPlatforms(platforms.map(p => {
                  if (p.id !== activePlatformId) return p;
                  return { ...p, cards: p.cards.map(c => c.id === activeCardId ? { ...c, status: 'pending', requester: CURRENT_USER.name, comments: [...c.comments, newComment] } : c) };
                }));
                setShowRulesModal(false);
                setRulesAccepted(false);
                if (commentScrollRef.current) setTimeout(() => commentScrollRef.current.scrollTop = commentScrollRef.current.scrollHeight, 100);
              }} 
              className={`flex-1 py-2.5 rounded-xl font-bold shadow-sm transition active:scale-95 ${rulesAccepted ? 'bg-[#527DA3] text-white' : 'bg-gray-200 text-gray-400 pointer-events-none'}`}
            >
              ثبت درخواست
            </button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-[#1e1e1e] flex items-center justify-center sm:p-6 selection:bg-blue-200">
      <div dir="rtl" className="w-full h-[100dvh] sm:w-[390px] sm:h-[844px] bg-white sm:rounded-[3rem] sm:border-[12px] sm:border-black relative overflow-hidden flex flex-col font-sans text-right antialiased shadow-[0_0_50px_rgba(0,0,0,0.5)]" style={{ fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }}>
        {isDrawerOpen && renderDrawer()}
        {renderAiModal()}
        {renderRulesModal()}
        {renderPublishToast()}

        {activeChatId ? (
          renderChatRoom()
        ) : activePlatformId ? (
          renderPlatformInternal()
        ) : (
          <div className="flex flex-col h-full absolute inset-0 bg-[#f4f4f5]">
            {renderHeader()}
            <main className="flex-1 overflow-y-auto relative">
              {activeTab === 'chats' && renderChatsList()}
              {activeTab === 'platforms' && renderPlatformsList()}
              {activeTab === 'comments' && renderGlobalComments()}
            </main>
            <div className="absolute bottom-5 left-4 z-20">
              <button onClick={() => { setActiveChatId('bot'); }} className="w-[56px] h-[56px] bg-[#527DA3] hover:bg-[#466a8a] text-white rounded-full shadow-lg flex items-center justify-center transition-transform active:scale-95"><Pen size={24} strokeWidth={2.5} /></button>
            </div>
          </div>
        )}
        <div className="hidden sm:block absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[25px] bg-black rounded-b-3xl z-50 pointer-events-none"></div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
